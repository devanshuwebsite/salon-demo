<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | Page Not Found</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#111;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

.container h1{
font-size:120px;
color:#ff6fb5;
}

.container h2{
margin:15px 0;
}

.container p{
color:#ccc;
margin-bottom:30px;
}

.container a{
display:inline-block;
padding:14px 30px;
background:#ff6fb5;
color:#fff;
text-decoration:none;
border-radius:50px;
transition:.3s;
}

.container a:hover{
background:#ff2d95;
}

</style>

</head>

<body>

<div class="container">

<h1>404</h1>

<h2>Oops! Page Not Found</h2>

<p>The page you are looking for doesn't exist.</p>

<a href="index.html">Back to Home</a>

</div>

</body>

</html>
